name: Deploy Nucleus

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 900s
          command_timeout: 15m
          script: |
            set -e

            cd /root/nucleus

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Updating backend..."
            cd /root/nucleus/server
            npm install
            npx prisma migrate 
            npx prisma db push

            echo "Updating frontend..."
            cd /root/nucleus/client
            npm install
            npm run build

            echo "Restarting applications..."
            pm2 restart nucleus-backend
            pm2 restart nucleus-frontend

            pm2 save

            echo "Deployment completed successfully."
